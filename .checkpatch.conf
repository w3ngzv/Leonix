# Options for scripts/checkpatch.pl, which reads this file from the top
# of the tree.  Leonix is not a Linux tree, so the checks that look for
# one are off.
#
# 供 scripts/checkpatch.pl 使用的选项, 该脚本从源码树顶层读取本文件. Leonix 不是
# Linux 源码树, 因此关闭检查 Linux 源码树的项.
--no-tree

# Each type below asks for something Linux has and Leonix does not.
#
# 下列每个类型要求的都是 Linux 具备而 Leonix 不具备的东西.
#
# printk() in Leonix has no log levels (include/leonix/printk.h).
#
# Leonix 的 printk() 没有日志级别 (include/leonix/printk.h).
--ignore PRINTK_WITHOUT_KERN_LEVEL
# There is no compiler_attributes.h to define __packed, __noinline and
# the rest.
#
# 没有 compiler_attributes.h 来定义 __packed、__noinline 等宏.
--ignore PREFER_DEFINED_ATTRIBUTE_MACRO
# avr-libc has no strscpy(), the replacement checkpatch asks for.
#
# avr-libc 没有 checkpatch 要求替换成的 strscpy().
--ignore STRCPY
--ignore STRLCPY
--ignore STRNCPY
# Data shared with interrupt handlers is volatile: there is no
# READ_ONCE() or WRITE_ONCE(), and no barrier API besides.
#
# 与中断处理函数共享的数据使用 volatile: 没有 READ_ONCE() 或 WRITE_ONCE(), 也没
# 有其他内存屏障 API.
--ignore VOLATILE
